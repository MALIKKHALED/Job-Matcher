[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-matcher"
version = "0.1.0"
description = "Agentic Job Matcher - ATS scraping, resume optimization, cover letter generation"
requires-python = ">=3.12"
dependencies = [
    "crewai==1.15.11",
    "scrapegraph-py>=2.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11",
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]